services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
      MARIADB_DATABASE: ${DB_NAME:-db-crabook}
      MARIADB_USER: ${DB_USER:-crabook}
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      TZ: America/Santiago
    volumes:
      - db_data:/var/lib/mysql
      # Solo se ejecuta la primera vez, cuando el volumen está vacío
      - ./server/db-crabook.sql:/docker-entrypoint-initdb.d/01-db-crabook.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-db-crabook}
      DB_USER: ${DB_USER:-crabook}
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      AUTH_SECRET: ${AUTH_SECRET:?Define AUTH_SECRET en .env}
      COOKIE_SEGURA: ${COOKIE_SEGURA:-false}
    volumes:
      - uploads_data:/app/server/uploads
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8085}:8085"
    depends_on:
      db:
        condition: service_healthy
volumes:
  db_data:
  uploads_data:
